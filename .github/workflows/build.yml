name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BetterVampirism
          path: build/libs/*.jar
          if-no-files-found: error

  youer-server-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: BetterVampirism
          path: artifact
      - name: Check out Youer for NeoForge 21.1.243
        uses: actions/checkout@v4
        with:
          repository: MohistMC/Youer
          ref: 486e68ff418c2420c97eb8dcabf3802e75bbcbac
          path: youer
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the pinned Youer server
        run: |
          set -euo pipefail
          chmod +x youer/gradlew
          (
            cd youer
            ./gradlew setup --no-daemon
            ./gradlew youerJar --no-daemon
          )
      - name: Install Better Vampirism and Vampirism
        run: |
          set -euo pipefail
          mkdir -p server
          cp youer/projects/youer/build/libs/*-server.jar server/youer.jar
          mkdir -p server/mods
          cp artifact/bettervampirism-1.0.0.jar server/mods/
          curl --fail --location --retry 3 \
            --output server/mods/Vampirism-1.21-1.10.12.jar \
            https://mediafilez.forgecdn.net/files/8368/444/Vampirism-1.21-1.10.12.jar
          printf 'eula=true\n' > server/eula.txt
      - name: Verify Youer and NeoForge can load Better Vampirism
        run: |
          set -euo pipefail
          cd server
          set +e
          timeout 180s java -jar youer.jar nogui > server.log 2>&1
          server_exit=$?
          set -e
          find . -type f -name '*.log' -print -exec cat {} \; > combined.log
          if grep -Fq 'InvalidVersionSpecificationException' combined.log; then
            cat combined.log
            exit 1
          fi
          if ! grep -Fq 'NeoForge 21.1.243' combined.log; then
            cat combined.log
            exit 1
          fi
          if ! grep -Fq 'Better Vampirism 1.0.0 (bettervampirism)' combined.log; then
            cat combined.log
            exit 1
          fi
          if ! grep -Fq 'Done (' combined.log; then
            cat combined.log
            exit 1
          fi
          if [ "$server_exit" -ne 124 ] && [ "$server_exit" -ne 0 ]; then
            cat combined.log
            exit "$server_exit"
          fi
